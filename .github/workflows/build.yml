name: Build

# 触发策略：
# - push 到 main（含合并）→ 构建 debug + release 并上传产物
# - PR → 只构建 debug、跑单元测试，不做签名与发版
# - 手动触发 → 可指定是否同时跑 core 单测
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_core_tests:
        description: "同时运行 :core 单元测试"
        type: boolean
        default: true

# 同一分支的新提交取消上一次未完成的构建，避免排队浪费额度。
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # 统一 JDK：AGP 9 要求 JDK 17+，这里用 21（LTS，与 Gradle 9 官方推荐一致）
  JAVA_VERSION: "21"

jobs:
  build:
    name: 构建 APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 配置 JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          # 缓存 ~/.gradle，显著缩短二次构建时间；不要与 checkout 的缓存混用
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # Android SDK：runner 自带 SDK 目录，这里只补装需要的 platform / build-tools。
      # 注意：API 37 的包名带小版本（platforms;android-37.1 / 37.2），不存在裸的 android-37。
      # 「.0」小版本在 37 之后不再单独发布，因此这里直接装 37.2 并在工程里把 compileSdk 设为 37。
      - name: 安装 Android SDK 组件
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "SDK_ROOT=$SDK_ROOT"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          # 37 的首个小版本号在不同时间点是 37.1 或 37.2，按可用性择一安装
          PICK=""
          for p in "platforms;android-37.2" "platforms;android-37.1" "platforms;android-36"; do
            if "$SDKMANAGER" --list 2>/dev/null | grep -q "^  *$p "; then PICK="$p"; break; fi
          done
          if [ -z "$PICK" ]; then echo "::error::找不到可用的 Android platform 包"; exit 1; fi
          echo "将安装: $PICK"
          "$SDKMANAGER" --install "$PICK" "build-tools;37.0.0" "platform-tools"

      - name: 运行 :core 单元测试
        # PR 默认跑；手动触发时可关闭（用于只想要产物的场景）
        if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.run_core_tests)
        run: ./gradlew :core:test --stacktrace

      - name: 构建 Debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: 上传 Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: r-transfer-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      # release 需要签名配置；仓库里没有 keystore 时跳过，只出 debug 包。
      - name: 检查签名配置
        id: signing
        run: |
          if [ -f keystore.properties ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::未提供 keystore.properties，跳过 release 构建"
          fi

      - name: 构建 Release APK
        if: steps.signing.outputs.available == 'true' && github.event_name != 'pull_request'
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: 上传 Release APK
        if: steps.signing.outputs.available == 'true' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: r-transfer-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      # 构建失败时把完整日志留成产物，省得来回翻 Actions 页面。
      - name: 收集失败日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            **/build/reports/**
            **/build/outputs/logs/**
          if-no-files-found: ignore
          retention-days: 7
